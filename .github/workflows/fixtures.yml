name: fixtures

# Generates real Spark event logs (one app per scenario) for the test suite. Run manually, or when the generator
# changes; download the artifact and commit it under tests/fixtures/eventlogs/. Unit tests never need a JVM.
on:
  workflow_dispatch:
  push:
    paths: ["tools/gen_fixtures.py", ".github/workflows/fixtures.yml"]

jobs:
  generate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        spark: ["3.5.9", "4.0.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/fixtures.yml
      - name: Install pyspark ${{ matrix.spark }} (Java 17 is the runner default)
        run: |
          java -version
          pip install "pyspark==${{ matrix.spark }}"
      - name: Generate event logs
        run: python tools/gen_fixtures.py "out/spark-${{ matrix.spark }}"
      - uses: actions/upload-artifact@v4
        with:
          name: eventlogs-spark-${{ matrix.spark }}
          path: out/spark-${{ matrix.spark }}
          retention-days: 30
